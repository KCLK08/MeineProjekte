# Static site Worker + R2-backed APK downloads at /apks/*.
name = "kclk08"
main = "workers/apk-proxy.js"
compatibility_date = "2026-07-16"

[assets]
directory = "_site"
binding = "ASSETS"
# Multi-app static tree under /apps/* — keep real 404s, not SPA rewrite.
not_found_handling = "404-page"
# Only invoke the Worker for APK paths; everything else is static assets.
run_worker_first = ["/apks/*"]

[[r2_buckets]]
binding = "APKS"
bucket_name = "kclk08-apks"

[build]
command = "npm run build:pages"
