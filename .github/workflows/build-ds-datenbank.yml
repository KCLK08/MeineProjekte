name: Build DS-Datenbank APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/ds-datenbank/**'
      - 'packages/**'
      - '.github/workflows/build-ds-datenbank.yml'
      - '.github/workflows/reusable-build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/reusable-build-apk.yml
    secrets: inherit
    with:
      app-slug: ds-datenbank
      app-path: apps/ds-datenbank
      apk-name: DSDatenbank.apk
      app-version: '1.0.0'
