name: Sync APKs to Cloudflare R2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-apks-r2
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Sync GitHub Release APKs → R2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          chmod +x scripts/sync-github-apks-to-r2.sh scripts/upload-apk-r2.sh
          bash scripts/sync-github-apks-to-r2.sh
