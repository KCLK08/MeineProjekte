# yaml-language-server: $schema=
# Shared template note: keep the five build-*.yml files in sync intentionally
# (no reusable workflow – avoids GitHub startup_failure from permissions elevation).
name: Build Family Vault APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/familydata/**'
      - 'scripts/ci-build-apk.sh'
      - '.github/workflows/build-familydata.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-familydata
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install monorepo dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Default: local Gradle. Set to "1" only if you intentionally want eas build --wait.
          USE_EAS_BUILD: '0'
        run: |
          chmod +x scripts/ci-build-apk.sh
          scripts/ci-build-apk.sh apps/familydata FamilyVault.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: familydata-apk
          path: apps/familydata/FamilyVault.apk
          retention-days: 90

      - name: Update releases.json
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = 'website/releases.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          data.familydata = {
            version: process.env.APP_VERSION,
            buildDate: new Date().toISOString(),
            apkUrl: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/familydata-apk-latest/FamilyVault.apk`,
          };
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          EOF
        env:
          APP_VERSION: '1.0.0'

      - name: Commit releases.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/releases.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update Family Vault APK release metadata [skip ci]"
            git push
          fi

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: familydata-apk-latest
          name: Family Vault APK (1.0.0)
          body: |
            Automatischer Android-Build für Family Vault (`apps/familydata`).
            - Commit: ${{ github.sha }}
            - Run: ${{ github.run_number }}
          artifacts: apps/familydata/FamilyVault.apk
          allowUpdates: true
          makeLatest: false
          replacesArtifacts: true
