name: Reusable Expo APK Build

on:
  workflow_call:
    inputs:
      app-slug:
        required: true
        type: string
      app-path:
        required: true
        type: string
      apk-name:
        required: true
        type: string
      app-version:
        required: false
        type: string
        default: '1.0.0'
    secrets:
      EXPO_TOKEN:
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.app-path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install monorepo dependencies
        working-directory: .
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
        continue-on-error: true

      - name: Build APK with EAS
        id: eas
        continue-on-error: true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "EXPO_TOKEN not available – skip EAS cloud"
            exit 1
          fi
          eas build --platform android --profile preview --non-interactive --json --wait | tee eas-result.json
          URL=$(node -e "const fs=require('fs'); const raw=fs.readFileSync('eas-result.json','utf8').trim().split('\n').filter(Boolean).pop(); const r=JSON.parse(raw); const b=Array.isArray(r)?r[0]:r; process.stdout.write(b?.artifacts?.buildUrl||b?.applicationArchiveUrl||'');")
          if [ -z "$URL" ]; then
            echo "No artifact URL from EAS"
            exit 1
          fi
          curl -L "$URL" -o "${{ inputs.apk-name }}"
          echo "apk-path=${{ inputs.app-path }}/${{ inputs.apk-name }}" >> "$GITHUB_OUTPUT"

      - name: Fallback local APK
        id: local
        if: steps.eas.outcome != 'success'
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --no-install
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "../${{ inputs.apk-name }}"
          echo "apk-path=${{ inputs.app-path }}/${{ inputs.apk-name }}" >> "$GITHUB_OUTPUT"

      - name: Resolve APK path
        id: resolve
        working-directory: .
        run: |
          set -euo pipefail
          CANDIDATE="${{ steps.eas.outputs.apk-path }}"
          if [ -z "$CANDIDATE" ] || [ ! -f "$CANDIDATE" ]; then
            CANDIDATE="${{ steps.local.outputs.apk-path }}"
          fi
          if [ -z "$CANDIDATE" ] || [ ! -f "$CANDIDATE" ]; then
            CANDIDATE="${{ inputs.app-path }}/${{ inputs.apk-name }}"
          fi
          test -f "$CANDIDATE"
          ls -lh "$CANDIDATE"
          echo "apk-path=$CANDIDATE" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app-slug }}-apk
          path: ${{ steps.resolve.outputs.apk-path }}
          retention-days: 90

      - name: Update releases.json
        working-directory: .
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = 'website/releases.json';
          const slug = process.env.APP_SLUG;
          const apkName = process.env.APK_NAME;
          const version = process.env.APP_VERSION;
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          data[slug] = {
            version,
            buildDate: new Date().toISOString(),
            apkUrl: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${slug}-apk-latest/${apkName}`,
          };
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          EOF
        env:
          APP_SLUG: ${{ inputs.app-slug }}
          APK_NAME: ${{ inputs.apk-name }}
          APP_VERSION: ${{ inputs.app-version }}

      - name: Commit releases.json
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/releases.json
          if git diff --staged --quiet; then
            echo "No releases.json changes"
          else
            git commit -m "chore: update ${{ inputs.app-slug }} APK release metadata [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.app-slug }}-apk-latest
          name: ${{ inputs.app-slug }} APK (${{ inputs.app-version }})
          body: |
            Automatischer Android-Build für `${{ inputs.app-path }}`.

            - Commit: ${{ github.sha }}
            - Workflow: ${{ github.run_number }}
          artifacts: ${{ steps.resolve.outputs.apk-path }}
          allowUpdates: true
          makeLatest: false
          replacesArtifacts: true
