name: DS-Datenbank – Build

on:
  push:
    branches: [main]
    paths:
      - 'apps/ds-datenbank/**'
      - '.github/workflows/ds-datenbank-build.yml'
  pull_request:
    paths:
      - 'apps/ds-datenbank/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/ds-datenbank

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/ds-datenbank/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: ds-datenbank-dist
          path: apps/ds-datenbank/dist
          retention-days: 14
