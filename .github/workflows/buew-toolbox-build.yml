name: BÜW Toolbox – Build

on:
  push:
    branches: [main]
    paths:
      - 'apps/buew-toolbox/**'
      - 'scripts/assemble-buew-toolbox.mjs'
      - '.github/workflows/buew-toolbox-build.yml'
  pull_request:
    paths:
      - 'apps/buew-toolbox/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: |
          npm install --prefix apps/buew-toolbox
          npm install --prefix apps/buew-toolbox/sitereport
          npm install --prefix apps/buew-toolbox/bautagebuch-v2
      - name: Build
        run: npm run build --prefix apps/buew-toolbox
      - uses: actions/upload-artifact@v4
        with:
          name: buew-toolbox-dist
          path: apps/buew-toolbox/dist
          retention-days: 14
