name: Build BUEW-Toolbox APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/buew-toolbox/**'
      - '!apps/buew-toolbox/web/**'
      - 'scripts/ci-build-apk.sh'
      - '.github/workflows/build-buew-toolbox.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-buew-toolbox
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install monorepo dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Default: local Gradle. Set to "1" only if you intentionally want eas build --wait.
          USE_EAS_BUILD: '0'
        run: |
          chmod +x scripts/ci-build-apk.sh
          scripts/ci-build-apk.sh apps/buew-toolbox BuewToolbox.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: buew-toolbox-apk
          path: apps/buew-toolbox/BuewToolbox.apk
          retention-days: 90

      - name: Update releases.json
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = 'website/releases.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          data['buew-toolbox'] = {
            version: process.env.APP_VERSION,
            buildDate: new Date().toISOString(),
            apkUrl: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/buew-toolbox-apk-latest/BuewToolbox.apk`,
          };
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          EOF
        env:
          APP_VERSION: '1.0.0'

      - name: Commit releases.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/releases.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update buew-toolbox APK release metadata [skip ci]"
            git push
          fi

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: buew-toolbox-apk-latest
          name: buew-toolbox APK (1.0.0)
          body: |
            Automatischer Android-Build für `apps/buew-toolbox`.
            - Commit: ${{ github.sha }}
            - Run: ${{ github.run_number }}
          artifacts: apps/buew-toolbox/BuewToolbox.apk
          allowUpdates: true
          makeLatest: false
          replacesArtifacts: true
