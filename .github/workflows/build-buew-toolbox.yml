name: Build BUEW-Toolbox APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/buew-toolbox/**'
      - 'packages/**'
      - '.github/workflows/build-buew-toolbox.yml'
      - '.github/workflows/reusable-build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/reusable-build-apk.yml
    secrets: inherit
    with:
      app-slug: buew-toolbox
      app-path: apps/buew-toolbox
      apk-name: BuewToolbox.apk
      app-version: '1.0.0'
