name: Build ELIFBA APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/elifba/**'
      - 'packages/**'
      - '.github/workflows/build-elifba.yml'
      - '.github/workflows/reusable-build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/reusable-build-apk.yml
    secrets: inherit
    with:
      app-slug: elifba
      app-path: apps/elifba
      apk-name: Elifba.apk
      app-version: '1.0.0'
