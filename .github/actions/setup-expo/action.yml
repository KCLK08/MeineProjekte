name: Setup Expo
description: Node.js + Expo/EAS CLI for an app workspace
inputs:
  app-path:
    description: Path to the Expo app (e.g. apps/bautagebuch)
    required: true
  node-version:
    description: Node.js version
    required: false
    default: '20'
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: |
          package-lock.json
          ${{ inputs.app-path }}/package-lock.json

    - name: Install root workspace deps
      shell: bash
      run: |
        if [ -f package-lock.json ]; then npm ci; else npm install; fi

    - name: Install app deps
      shell: bash
      working-directory: ${{ inputs.app-path }}
      run: |
        if [ -f package-lock.json ]; then npm ci; else npm install; fi

    - name: Setup EAS CLI
      if: ${{ env.EXPO_TOKEN != '' }}
      uses: expo/expo-github-action@v8
      with:
        eas-version: latest
        token: ${{ env.EXPO_TOKEN }}

    - name: Install eas-cli locally (no token)
      if: ${{ env.EXPO_TOKEN == '' }}
      shell: bash
      run: npm install -g eas-cli || true
