name: Build Expo APK
description: Build Android APK via EAS (cloud) or local Gradle fallback
inputs:
  app-path:
    required: true
  apk-name:
    description: Output APK file name
    required: true
  profile:
    required: false
    default: preview
outputs:
  apk-path:
    description: Path to the generated APK
    value: ${{ steps.resolve.outputs.apk-path }}
runs:
  using: composite
  steps:
    - name: Build with EAS (cloud)
      id: eas
      shell: bash
      working-directory: ${{ inputs.app-path }}
      continue-on-error: true
      env:
        EXPO_TOKEN: ${{ env.EXPO_TOKEN }}
      run: |
        if [ -z "${EXPO_TOKEN}" ]; then
          echo "EXPO_TOKEN missing – skip EAS cloud build"
          exit 1
        fi
        eas build --platform android --profile ${{ inputs.profile }} --non-interactive --json --wait > eas-result.json
        URL=$(node -e "const r=require('./eas-result.json'); const b=Array.isArray(r)?r[0]:r; console.log(b?.artifacts?.buildUrl||b?.applicationArchiveUrl||'')")
        echo "build-url=$URL" >> "$GITHUB_OUTPUT"
        if [ -n "$URL" ]; then
          curl -L "$URL" -o "${{ inputs.apk-name }}"
        else
          exit 1
        fi

    - name: Fallback local APK (Expo prebuild + Gradle)
      id: local
      if: steps.eas.outcome != 'success'
      shell: bash
      working-directory: ${{ inputs.app-path }}
      run: |
        npx expo prebuild --platform android --no-install
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon
        cp app/build/outputs/apk/release/app-release.apk "../${{ inputs.apk-name }}"

    - name: Resolve APK path
      id: resolve
      shell: bash
      run: |
        PATH_APK="${{ inputs.app-path }}/${{ inputs.apk-name }}"
        test -f "$PATH_APK"
        echo "apk-path=$PATH_APK" >> "$GITHUB_OUTPUT"
        ls -lh "$PATH_APK"
